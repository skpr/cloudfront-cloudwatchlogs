project_name: cloudfront-cloudwatchlogs
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cloudfront-cloudwatchlogs
    ldflags:
      - '-extldflags -static'
    goos: [ linux ]
    goarch: [ amd64, arm64 ]
    env:
      - CGO_ENABLED=0

archives:
- formats:
    - zip
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

changelog:
  use: github-native
